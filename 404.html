<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OKIN Ent — Windhoek, Namibia</title>
<meta http-equiv="refresh" content="1; url=https://hub.okinent.org/">
<meta name="description" content="OKIN Trading Enterprises — the Hub. Business, Bitcoin and applied AI from Windhoek, Namibia.">
<link rel="canonical" href="https://hub.okinent.org/">
<style>
:root{--bg:#0E0C0A;--surface:#16130F;--ink:#EDE7DA;--dim:#A39A8B;--gold:#d4af37;--ember:#e8862d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Inter','Helvetica Neue',Arial,sans-serif;
display:flex;align-items:center;justify-content:center;text-align:center;
-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;padding:40px 28px}
.wordmark{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:2.6rem;
letter-spacing:.14em;color:var(--gold);text-transform:uppercase;line-height:1.1}
.wordmark span{display:block;font-size:.85rem;letter-spacing:.34em;color:var(--dim);margin-top:10px}
.rail{width:64px;height:2px;background:var(--gold);margin:34px auto}
.going{font-size:.95rem;color:var(--dim);line-height:1.7}
.going b{color:var(--ink);font-weight:600}
.door{display:inline-block;margin-top:26px;padding:13px 34px;border:1px solid var(--gold);
border-radius:2px;color:var(--gold);text-decoration:none;font-size:.82rem;letter-spacing:.18em;
text-transform:uppercase;transition:all .25s ease}
.door:hover{background:var(--gold);color:var(--bg)}
.foot{margin-top:52px;font-size:.72rem;letter-spacing:.06em;color:#5d564b}
</style>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap">
<div class="wordmark">OKIN<span>Trading Enterprises</span></div>
<div class="rail"></div>
<p class="going">Taking you to <b>the Hub</b> — the front door to<br>OKIN Business, OKIN Bitcoin and GTO Labs.</p>
<a class="door" href="https://hub.okinent.org/">Enter the Hub</a>
<div class="foot">OKIN Trading Enterprises CC &middot; Windhoek, Namibia &middot; okinent.org</div>
</div>
<script>location.replace('https://hub.okinent.org/');</script>
</body>
</html>
